    <rect x="466" y="758" width="150" height="34" rx="17" fill="#ffffff" opacity="0.12"/><text x="541" y="780" text-anchor="middle" fill="#ffffff">Azure AI Search</text>
    <rect x="628" y="758" width="150" height="34" rx="17" fill="#ffffff" opacity="0.12"/><text x="703" y="780" text-anchor="middle" fill="#ffffff">Azure Cosmos DB</text>
    <rect x="790" y="758" width="150" height="34" rx="17" fill="#ffffff" opacity="0.12"/><text x="865" y="780" text-anchor="middle" fill="#ffffff">Azure App Service</text>
    <rect x="952" y="758" width="200" height="34" rx="17" fill="#ffffff" opacity="0.12"/><text x="1052" y="780" text-anchor="middle" fill="#ffffff">GitHub Copilot (dev-time)</text>
  </g>

  <line x1="740" y1="806" x2="740" y2="832" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ===== OUTPUTS ===== -->
  <g filter="url(#sh)"><rect x="180" y="834" width="1150" height="82" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/></g>
  <text x="204" y="862" font-size="13" font-weight="800" fill="#6d28d9">CLIENT OUTPUTS</text>
  <g font-size="12" font-weight="700" fill="#5b21b6">
    <rect x="204" y="874" width="150" height="30" rx="15" fill="#ffffff" stroke="#ddd6fe"/><text x="279" y="894" text-anchor="middle">Readiness Score</text>
    <rect x="366" y="874" width="130" height="30" rx="15" fill="#ffffff" stroke="#ddd6fe"/><text x="431" y="894" text-anchor="middle">ROI Estimate</text>
    <rect x="508" y="874" width="180" height="30" rx="15" fill="#ffffff" stroke="#ddd6fe"/><text x="598" y="894" text-anchor="middle">Architecture Blueprint</text>
    <rect x="700" y="874" width="130" height="30" rx="15" fill="#ffffff" stroke="#ddd6fe"/><text x="765" y="894" text-anchor="middle">Code Scaffold</text>
    <rect x="842" y="874" width="160" height="30" rx="15" fill="#ffffff" stroke="#ddd6fe"/><text x="922" y="894" text-anchor="middle">Validation Report</text>
    <rect x="1014" y="874" width="160" height="30" rx="15" fill="#ffffff" stroke="#ddd6fe"/><text x="1094" y="894" text-anchor="middle">Portfolio Ranking</text>
  </g>

  <!-- ===== RIGHT CROSS-CUTTING RAIL ===== -->
  <rect x="1360" y="362" width="200" height="444" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1460" y="350" text-anchor="middle" font-size="10.5" font-weight="800" fill="#94a3b8" letter-spacing="1">CROSS-CUTTING</text>

  <g filter="url(#sh)"><rect x="1378" y="386" width="164" height="180" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/></g>
  <text x="1460" y="430" text-anchor="middle" font-size="26">🧑‍⚖️</text>
  <text x="1460" y="462" text-anchor="middle" font-size="13.5" font-weight="800" fill="#92400e">Human-in-</text>
  <text x="1460" y="480" text-anchor="middle" font-size="13.5" font-weight="800" fill="#92400e">the-Loop</text>
  <text x="1460" y="510" text-anchor="middle" font-size="10.5" fill="#b45309"><tspan x="1460" dy="0">Mandatory gate on</tspan><tspan x="1460" dy="13">high-compliance /</tspan><tspan x="1460" dy="13">high-error-cost</tspan><tspan x="1460" dy="13">workflows</tspan></text>

  <g filter="url(#sh)"><rect x="1378" y="586" width="164" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/></g>
  <text x="1460" y="630" text-anchor="middle" font-size="26">🔭</text>
  <text x="1460" y="662" text-anchor="middle" font-size="13.5" font-weight="800" fill="#334155">Observability</text>
  <text x="1460" y="680" text-anchor="middle" font-size="13.5" font-weight="800" fill="#334155">&amp; Audit Trace</text>
  <text x="1460" y="710" text-anchor="middle" font-size="10.5" fill="#64748b"><tspan x="1460" dy="0">Per-stage status</tspan><tspan x="1460" dy="13">+ latency logged</tspan><tspan x="1460" dy="13">for every run —</tspan><tspan x="1460" dy="13">a real audit trail</tspan></text>

  <!-- footer tech tags -->
  <text x="48" y="1000" font-size="12.5" font-weight="700" fill="#64748b">AI techniques:</text>
  <g font-size="11.5" font-weight="600" fill="#6d28d9">
    <rect x="150" y="986" width="170" height="22" rx="11" fill="#f3f0ff"/><text x="235" y="1001" text-anchor="middle">Function calling</text>
    <rect x="330" y="986" width="70" height="22" rx="11" fill="#f3f0ff"/><text x="365" y="1001" text-anchor="middle">RAG</text>
    <rect x="410" y="986" width="190" height="22" rx="11" fill="#f3f0ff"/><text x="505" y="1001" text-anchor="middle">Multi-agent orchestration</text>
    <rect x="610" y="986" width="130" height="22" rx="11" fill="#f3f0ff"/><text x="675" y="1001" text-anchor="middle">Agentic memory</text>
    <rect x="750" y="986" width="170" height="22" rx="11" fill="#f3f0ff"/><text x="835" y="1001" text-anchor="middle">Governance gate</text>
    <rect x="930" y="986" width="180" height="22" rx="11" fill="#f3f0ff"/><text x="1020" y="1001" text-anchor="middle">Self-critique + conf.</text>
  </g>
  <text x="48" y="1048" font-size="12" fill="#94a3b8">Stack: React · TypeScript · Tailwind · FastAPI · LangGraph · Azure OpenAI (GPT-4o) · Azure AI Search · Cosmos DB · Azure App Service · Docker</text>
