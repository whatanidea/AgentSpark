name: Delivery gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, types and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENTSENSE_MODE: demo
      AGENTSENSE_AUTH_MODE: local-demo
      ENVIRONMENT: development
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install hash-locked backend and lock tooling
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip install -r requirements-tools.txt
          python scripts/check_lock.py
      - name: Restore locked frontend and check dependency advisories
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit --audit-level=high
      - name: Backend regressions, evaluations, types and SPA build
        run: python scripts/check.py
      - name: Browser workflow regressions
        run: |
          npm --prefix frontend exec -- playwright install --with-deps chromium
          npm --prefix frontend run test:e2e

  package:
    name: Container smoke and release artifact
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: agentsense:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
      - name: Verify non-root image, fail-closed startup and read-only demo lifecycle
        env:
          IMAGE: agentsense:${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "10001:10001"
          set +e
          timeout 30s docker run --rm --name agentsense-unconfigured "$IMAGE" > unconfigured.log 2>&1
          status=$?
          set -e
          if [ "$status" = 0 ] || [ "$status" = 124 ]; then
            echo "::error::Unconfigured production image unexpectedly started."
            exit 1
          fi
          grep -q "Set AGENTSENSE_MODE=demo or live in production" unconfigured.log
          docker run --detach --name agentsense-smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /home/agentsense/.agentspark:rw,noexec,nosuid,size=16m,uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e ENVIRONMENT=development -e AGENTSENSE_MODE=demo -e AGENTSENSE_AUTH_MODE=local-demo \
            -p 127.0.0.1:8000:8000 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 2
          done
          python3 scripts/smoke.py --url http://127.0.0.1:8000 --expect-mode demo --demo-workflow
          docker exec agentsense-smoke python -c \
            "from pathlib import Path; assert not any(Path('/app').rglob('.env*')); assert not Path('/app/.git').exists(); assert not Path('/app/tests').exists()"
      - name: Stop disposable smoke container
        if: always()
        run: |
          set -euo pipefail
          for name in agentsense-smoke agentsense-unconfigured; do
            containers=$(docker ps -aq --filter "name=^${name}$")
            if [ -n "$containers" ]; then docker rm --force "$containers"; fi
          done
      - name: Prepare immutable release archive and metadata
        env:
          IMAGE: agentsense:${{ github.sha }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir release
          docker image save "$IMAGE" | gzip > release/agentsense-linux-amd64.tar.gz
          docker image inspect "$IMAGE" > release/image-inspect.json
          cp requirements.lock frontend/package-lock.json release/
          python3 -c 'import json, os; from pathlib import Path; Path("release/release.json").write_text(json.dumps({"revision": os.environ["REVISION"], "image": os.environ["IMAGE"], "platform": "linux/amd64", "deployed": False}, indent=2) + "\n")'
          (cd release && sha256sum agentsense-linux-amd64.tar.gz image-inspect.json requirements.lock package-lock.json release.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentsense-${{ github.sha }}-linux-amd64
          path: release/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
