services:
  agentspark:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AGENTSENSE_MODE: ${AGENTSENSE_MODE:-demo}
      DEMO_ARCHIVE_PATH: /home/agentsense/.agentspark/decisions.sqlite3
    volumes:
      - decision_archive:/home/agentsense/.agentspark
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  decision_archive: {}
