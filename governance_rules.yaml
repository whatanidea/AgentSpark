# Ordered policies: every condition in a policy must match; first policy wins.
# first_year_net_savings = annual gross labor savings - one-time build cost.
policies:
  - id: REJECT_HIGH_RISK_AUTONOMY
    conditions:
      - {field: autonomy_level, operator: eq, value: Autonomous}
      - {field: requires_hitl, operator: eq, value: true}
    decision: REJECT
    reason: "A workflow requiring human oversight cannot be autonomous."

  - id: REJECT_NOT_SUITABLE
    conditions:
      - {field: classification, operator: eq, value: Not Suitable}
    decision: REJECT
    reason: "Readiness is too low for an agentic solution; use standard software."

  - id: REJECT_UNSAFE
    conditions:
      - {field: security, operator: eq, value: FAIL}
    decision: REJECT
    reason: "The limited architecture policy check failed."

  - id: REJECT_POOR_ROI
    conditions:
      - {field: first_year_net_savings, operator: lt, value: 0}
    decision: REJECT
    reason: "First-year gross labor savings do not cover the one-time implementation cost."

  - id: HITL_HIGH_COMPLIANCE
    conditions:
      - {field: compliance, operator: eq, value: HIGH}
    decision: HUMAN_REVIEW_REQUIRED
    reason: "Workflow operates in a high-compliance domain."

  - id: HITL_REQUIRED
    conditions:
      - {field: requires_hitl, operator: eq, value: true}
    decision: HUMAN_REVIEW_REQUIRED
    reason: "The readiness assessment requires human oversight."

  - id: HITL_RESTRICTED_DATA
    conditions:
      - {field: data_sensitivity, operator: eq, value: RESTRICTED}
    decision: HUMAN_REVIEW_REQUIRED
    reason: "Workflow handles restricted data."

  - id: HITL_LOW_CONFIDENCE
    conditions:
      - {field: confidence, operator: lt, value: 70}
    decision: HUMAN_REVIEW_REQUIRED
    reason: "Recommendation completeness is below the minimum threshold."

  - id: AUTO_APPROVE_SAFE
    conditions:
      - {field: confidence, operator: gt, value: 90}
      - {field: compliance, operator: eq, value: LOW}
      - {field: security, operator: eq, value: PASS}
      - {field: first_year_net_savings, operator: gt, value: 0}
      - {field: operational_risk, operator: eq, value: LOW}
    decision: AUTO_APPROVE
    reason: "Workflow is low risk, sufficiently complete, and covers build cost in year one."

default_decision: HUMAN_REVIEW_REQUIRED
